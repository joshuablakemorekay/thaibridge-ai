# Evaluation rubric for: Chanting Book Entry (stage 1 output)
#
# These check the SHAPE of the stage 1 output — the JSON stage 2 has to parse.
# They cannot check whether the Pali is correct; only the physical book can do
# that, which is why a human checkpoint sits between the two stages.
#
# `output` is the whole reply. The JSON object is extracted from the first {
# to the last }, so the trailing count sentence does not break parsing.

prompt: chanting-book-entry
version: 4
criteria:
  - name: emits_parseable_json
    description: The reply contains one JSON object that actually parses
    weight: 5
    pass_condition: "json.loads(output[output.index('{'):output.rindex('}') + 1]) is not None"

  - name: has_every_required_key
    description: The object carries the keys stage 2 maps straight across
    weight: 5
    pass_condition: "all(k in json.loads(output[output.index('{'):output.rindex('}') + 1]) for k in ['working_notes', 'title_thai', 'title_english', 'when_chanted', 'summary', 'background', 'meaning', 'verses', 'checks'])"

  # The evaluator's sandbox has no `list`, so an array is identified as
  # "not a string, indexable, holding strings" — which a bare blob fails.
  - name: background_and_meaning_are_arrays
    description: Paragraph fields are arrays of strings, not one blob
    weight: 4
    pass_condition: "all(type(json.loads(output[output.index('{'):output.rindex('}') + 1])[k]) is not str and type(json.loads(output[output.index('{'):output.rindex('}') + 1])[k][0]) is str for k in ['background', 'meaning'])"

  - name: values_are_single_line
    description: No string value contains a literal newline
    weight: 5
    pass_condition: "all('\\n' not in v for v in json.loads(output[output.index('{'):output.rindex('}') + 1]).values() if type(v) is str)"

  - name: verses_are_single_line_too
    description: Every verse layer is one unwrapped line
    weight: 5
    pass_condition: "all('\\n' not in v for verse in json.loads(output[output.index('{'):output.rindex('}') + 1])['verses'] for v in verse.values() if type(v) is str)"

  - name: every_verse_carries_its_layers
    description: Each verse has all five layers plus its number
    weight: 5
    pass_condition: "all(all(k in verse for k in ['number', 'pali', 'pali_roman', 'thai', 'paiboon', 'english']) for verse in json.loads(output[output.index('{'):output.rindex('}') + 1])['verses'])"

  - name: checks_name_their_verse
    description: Every check says which verse it belongs to, or null for the whole chant
    weight: 4
    pass_condition: "all('verse' in c and 'issue' in c for c in json.loads(output[output.index('{'):output.rindex('}') + 1])['checks'])"

  - name: sections_are_bilingual
    description: Section labels carry the Thai/Pali name as well as the English
    weight: 4
    pass_condition: "all(re.search(r'[฀-๿]', verse['section']) for verse in json.loads(output[output.index('{'):output.rindex('}') + 1])['verses'] if 'section' in verse)"

  - name: paiboon_not_rtgs
    description: The Paiboon+ layer avoids RTGS aspiration spellings
    weight: 5
    pass_condition: "not any(re.search(r'(kh|th|ph)[aeiouɛɔəʉ]', verse['paiboon']) for verse in json.loads(output[output.index('{'):output.rindex('}') + 1])['verses'])"

  - name: uses_eng_not_ng
    description: ง is written ŋ throughout the Paiboon+ layer, never ng
    weight: 4
    pass_condition: "not any('ng' in verse['paiboon'] for verse in json.loads(output[output.index('{'):output.rindex('}') + 1])['verses'])"

  - name: pali_roman_uses_iast_diacritics
    description: Romanised Pali carries proper IAST diacritics
    weight: 3
    pass_condition: "any(c in output for c in ['ā', 'ī', 'ū', 'ṃ', 'ṅ', 'ñ', 'ṭ', 'ḍ', 'ṇ', 'ḷ'])"

  - name: working_notes_are_filled_in
    description: The working notes report on invitation, units, ordering and conventions
    weight: 4
    pass_condition: "all(k in json.loads(output[output.index('{'):output.rindex('}') + 1])['working_notes'] for k in ['invitation', 'units', 'ordering', 'conventions'])"

  - name: closes_with_a_check_count
    description: The reply ends by counting what still needs checking against the book
    weight: 3
    pass_condition: "re.search(r'(need|needs) your eye|need checking|against the physical book', output) is not None"

test_cases:
  - input:
      document: "A page copied from a Thai chanting book — Pali in Thai script interleaved with its Thai translation, no line breaks"
    expected_traits:
      - one parseable JSON object, every value on a single line
      - one Pali line per verse, in the book's order
      - checks in their own array, each naming its verse
      - empty string for a Pali title the book does not give
      - Paiboon+ throughout, ŋ never ng
