{# Shared by the forgot-password and reset-password pages. Same look as login.html. #}
<style>
    .login-wrapper {
        max-width: 460px;
        margin: 3rem auto;
        padding: 2rem;
    }

    .form-group {
        margin: 1.25rem 0;

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--dark-text);
    }

    .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        border: 2px solid #ddd;

        transition: border-color 0.2s ease;
