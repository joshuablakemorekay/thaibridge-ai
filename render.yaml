# render.yaml — Render Blueprint for ThaiBridge AI (free tier)
# Render reads this file automatically when you create a Blueprint from the repo.

services:
  - type: web
    name: thaibridge-ai
    runtime: python
    plan: free                         # free tier (sleeps after ~15 min idle, wakes in ~30s)
    region: frankfurt                  # closest region to the UK
    branch: main                       # trunk — rebuild-experiment merged into main 2026-06-10

    # Deploy every push to main. Declared here rather than left to the dashboard
    # toggle because Render only defaults this on for NEW services — an existing
    # service keeps whatever the dashboard says, and the Blueprint never corrects
    # it. On 2026-08-17 a push sat undeployed for half an hour while the site
    # reported itself healthy on two-hour-old code, which is the quiet kind of
    # wrong: nothing fails, the work simply isn't live. Version-controlling it
    # means the setting can't drift back. (autoDeploy is the deprecated spelling.)
    autoDeployTrigger: commit

    # Use the helper script so any Windows-only packages can't break the Linux build.
    buildCommand: "bash ./render-build.sh"

    # app.py contains `app = Flask(__name__)`, so this is correct.
    startCommand: "gunicorn app:app"

    envVars:
      # Flask session secret — Render generates a strong random value automatically.
      - key: FLASK_SECRET_KEY
        generateValue: true

      # Neon Postgres connection string. sync:false means the VALUE is set in the
      # Render dashboard and preserved across deploys — declaring it here is what
      # stops the Blueprint re-sync from wiping it.
      # ⚠️ This one is load-bearing: if it is ever unset, app.py falls back to a
      # SQLite file on Render's ephemeral disk, which is wiped on every deploy —
      # so accounts and subscriptions would start silently disappearing again,
      # with no error to notice. Use the POOLED connection string (the host with
      # '-pooler' in it); Neon suspends idle compute and the pooler handles the
      # reconnection. Left unset locally on purpose, so dev uses SQLite.
      - key: DATABASE_URL
        sync: false

      # Your Anthropic API key — NOT stored in this file. Render asks you for it
      # once when you create the Blueprint, then keeps it securely.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Developer-mode password. sync:false means the VALUE is set in the Render
      # dashboard and preserved across deploys (same pattern as MONK_MODE_CODES),
      # so a known password can be used instead of a random generated one.
      # ⚠️ The value MUST be set in the dashboard — if it's ever left unset, the
      # code falls back to "changeme", a guessable backdoor on a public demo.
      - key: DEVELOPER_PASSWORD
        sync: false

      # Use the cheap, fast Haiku model on the public demo so visitor AI messages
      # cost a fraction of a cent. Local dev (no AI_MODEL set) keeps using Sonnet.
      - key: AI_MODEL
        value: "claude-haiku-4-5-20251001"

      # Monk Mode access codes (comma-separated). sync:false means the VALUE is
      # set in the Render dashboard and preserved across deploys — declaring it
      # here stops the Blueprint re-sync from wiping the dashboard value. Unset =
      # Monk Mode simply can't be unlocked (fails safe), never a crash.
      - key: MONK_MODE_CODES
        sync: false
